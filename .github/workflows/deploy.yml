name: Deploy Merraki Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          timeout: 30s

          script: |
            set -Eeuo pipefail

            cd ~/apps/Merraki-Backend

            echo "========================================"
            echo "1. Pulling latest code"
            echo "========================================"

            git fetch origin main
            git reset --hard origin/main

            echo "========================================"
            echo "2. Rebuilding API"
            echo "========================================"

            docker compose -f docker-compose.prod.yml build api

            echo "========================================"
            echo "3. Running database migrations"
            echo "========================================"

            docker compose -f docker-compose.prod.yml run --rm api \
              node dist/db/migrate.js

            echo "========================================"
            echo "4. Starting API"
            echo "========================================"

            docker compose -f docker-compose.prod.yml up -d api

            echo "========================================"
            echo "5. Waiting for API health"
            echo "========================================"

            HEALTH_FILE="/tmp/merraki-health.json"
            API_READY=false

            for i in $(seq 1 30); do
              echo "Health check $i/30..."

              if curl --fail --silent --show-error \
                --max-time 5 \
                http://127.0.0.1:8000/health \
                > "$HEALTH_FILE"; then

                echo "✅ API is healthy"
                API_READY=true
                break
              fi

              echo "⏳ API not ready yet"
              sleep 2
            done

            if [ "$API_READY" != "true" ]; then
              echo "❌ API failed health check"

              echo "========================================"
              echo "Container status"
              echo "========================================"

              docker compose -f docker-compose.prod.yml ps

              echo "========================================"
              echo "API logs"
              echo "========================================"

              docker logs --tail=200 merraki-api || true

              exit 1
            fi

            echo "========================================"
            echo "Health response"
            echo "========================================"

            cat "$HEALTH_FILE"
            echo

            echo "========================================"
            echo "Final container status"
            echo "========================================"

            docker compose -f docker-compose.prod.yml ps

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"
